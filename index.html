<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Portal</title>
    <style>
        :root { --bg: #000; --box: #1a1a1a; --gold: #ffcc00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        #login-screen, #portal-screen { background: var(--box); padding: 40px; border-radius: 15px; text-align: center; width: 100%; max-width: 700px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
        #portal-screen { display: none; }
        h1, h2 { color: var(--gold); text-transform: uppercase; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn { background: var(--gold); color: black; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; transition: 0.3s; margin-top: 10px; font-size: 1rem; }
        .btn:hover { background: #ffdb4d; transform: scale(1.02); }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
        .game-button { background: #222; color: var(--gold); text-decoration: none; padding: 15px; border: 2px solid var(--gold); border-radius: 10px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; text-align: center; }
        .game-button:hover { background: var(--gold); color: black; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>STUDENT VALIDATION</h2>
        <input type="text" id="studentName" placeholder="Seu Nome Completo">
        <input type="password" id="studentPass" placeholder="Senha de Acesso">
        <button onclick="checkAccess()" class="btn">ENTRAR NO PORTAL</button>
    </div>

    <div id="portal-screen">
        <h1>Learning Portal</h1>
        <div class="grid">
            <a href="family-members-1.html" class="game-button">Family Members 1</a>
            <a href="family-members-advanced.html" class="game-button">Family Advanced 1</a>
            <a href="family-members-advanced-2.html" class="game-button">Family Advanced 2</a>
            <a href="verb-to-be.html" class="game-button">Verb to Be</a>
            <a href="occupations.html" class="game-button">Occupations</a>
            <a href="memory-game-adjectives-people.html" class="game-button">Adjectives: People</a>
            <a href="corporate-match.html" class="game-button">Corporate Match</a>
            <a href="phrasal-verbs-game.html" class="game-button">Phrasal Verbs</a>
            <a href="as-varias-formas-de-bring.html" class="game-button">Bring Challenges</a>
        </div>
    </div>

    <script>
        function checkAccess() {
            const pass = document.getElementById('studentPass').value;
            // SENHA DEFINIDA COMO: freitas2026
            if (pass === "freitas2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('portal-screen').style.display = 'block';
            } else {
                alert("Senha incorreta!");
            }
        }
    </script>
</body>
</html>
