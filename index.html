<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Portal</title>
    <style>
        :root { --bg: #000; --box: #1a1a1a; --gold: #ffcc00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        #login-screen, #portal-screen { 
            background: var(--box); 
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); 
        }
        
        #portal-screen { display: none; }
        h1, h2 { color: var(--gold); text-transform: uppercase; margin-bottom: 20px; }
        
        input { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; 
            border: 2px solid #333; background: #000; color: white; 
            box-sizing: border-box; text-align: center; font-size: 1rem;
        }

        .btn { 
            background: var(--gold); color: black; border: none; padding: 14px; 
            font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; 
            transition: 0.3s; text-transform: uppercase; margin-top: 15px;
        }

        /* Grade de 2 colunas para os 6 jogos */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-top: 30px; 
        }
        
        .game-button { 
            background: #1a1a1a; color: var(--gold); text-decoration: none; 
            padding: 15px; border: 1.5px solid var(--gold); border-radius: 8px; 
            font-weight: bold; font-size: 0.85rem; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; text-align: center;
        }

        .game-button:hover { background: var(--gold); color: black; }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>STUDENT VALIDATION</h2>
        <input type="text" id="studentName" placeholder="Nome do Aluno">
        <input type="password" id="studentPass" placeholder="Senha de Acesso">
        <button onclick="checkAccess()" class="btn">ENTRAR NO PORTAL</button>
    </div>

    <div id="portal-screen">
        <h2 id="welcome-msg" style="color: var(--gold);">WELCOME!</h2>
        <div class="grid">
            <a href="family-members-1.html" class="game-button">Family Members 1</a>
            <a href="family-members-advanced.html" class="game-button">Family Advanced 1</a>
            <a href="family-members-advanced-2.html" class="game-button">Family Advanced 2</a>
            <a href="verb-to-be.html" class="game-button">Verb to Be</a>
            <a href="occupations.html" class="game-button">Occupations</a>
            <a href="corporate-match.html" class="game-button">Corporate Match</a>
        </div>
    </div>

    <script>
        function checkAccess() {
            const name = document.getElementById('studentName').value;
            const pass = document.getElementById('studentPass').value;

            if (name.trim() !== "" && pass === "freitas2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('portal-screen').style.display = 'block';
                document.getElementById('welcome-msg').innerText = `WELCOME, ${name.toUpperCase()}!`;
            } else {
                alert("Verifique seu nome e senha.");
            }
        }
    </script>
</body>
</html>
