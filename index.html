<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Portal</title>

    <style>
        /* ESTILO CSS - AQUI FICA O PRETO E AMARELO */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #login-screen {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .login-box {
            border: 2px solid yellow;
            padding: 40px 30px;
            border-radius: 20px;
            background-color: #111;
            box-shadow: 0px 0px 20px rgba(255, 255, 0, 0.2);
        }

        h2 { 
            color: yellow; 
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid yellow;
            background: #222;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input::placeholder {
            color: #888;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: yellow;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #ffd700;
            transform: scale(1.02);
        }

        /* PORTAL DE JOGOS */
        #portal-screen {
            display: none;
            width: 90%;
            max-width: 700px;
            padding: 40px 0;
        }

        .game-button {
            display: block;
            text-decoration: none;
            border: 2px solid yellow;
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 20px;
            transition: 0.2s;
            background: rgba(255, 255, 0, 0.05);
        }

        .game-button:hover {
            background-color: #1a1a1a;
            transform: scale(1.02);
        }

        .game-title {
            color: yellow;
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
            text-align: center;
        }

        h1 {
            color: yellow;
            text-align: center;
            border-bottom: 2px solid yellow;
            padding-bottom: 15px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>STUDENT VALIDATION</h2>

        <form id="accessForm" 
              action="https://docs.google.com/forms/d/e/1FAIpQLSdDRDwRyGWb8wX8N9B2xWYtzFxsX2JQg4rp8hMdbcxYO_ixzQ/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="return validateAndSubmit()">
            
            <input type="text" name="entry.123456789" id="studentName" placeholder="Seu Nome Completo" required>
            
            <input type="password" id="studentPass" placeholder="Senha de Acesso" required>
            
            <button type="submit" class="btn">ENTRAR NO PORTAL</button>
        </form>

        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="checkSuccess()"></iframe>
    </div>
</div>

<div id="portal-screen">
    <h1>Learning Portal</h1>
    <a href="family-members-1.html" class="game-button"><span class="game-title">Family Members 1</span></a>
    <a href="family-members-advanced.html" class="game-button"><span class="game-title">Family Members Advanced</span></a>
    <a href="fill-in-the-blanks-2-verb-to-be.html" class="game-button"><span class="game-title">Verb to Be</span></a>
    <a href="memory-game-adjectives-people.html" class="game-button"><span class="game-title">Adjectives: People</span></a>
    <a href="memory-game-occupations-freitasenglishclass.html" class="game-button"><span class="game-title">Occupations</span></a>
    <a href="corporate-match.html" class="game-button"><span class="game-title">Corporate Match</span></a>
    <a href="phrasal-verbs1-game.html" class="game-button"><span class="game-title">Phrasal Verbs</span></a>
    <a href="as-varias-formas-de-bring.html" class="game-button"><span class="game-title">Bring (20 Challenges)</span></a>
</div>

<script>
    var isSubmitted = false;

    function validateAndSubmit() {
        const pass = document.getElementById('studentPass').value;
        
        // NOVA SENHA SOLICITADA
        if(pass === "s_tudent2026") {
            isSubmitted = true;
            return true; // Deixa o formulário ser enviado para o iframe
        } else {
            alert("Senha incorreta.");
            return false; // Cancela o envio
        }
    }

    function checkSuccess() {
        if(isSubmitted) {
            // Esconde login e mostra portal
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('portal-screen').style.display = 'block';
            document.body.style.justifyContent = 'flex-start';
        }
    }
</script>

</body>
</html>
