<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Portal</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #login-screen {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .login-box {
            border: 2px solid yellow;
            padding: 30px;
            border-radius: 20px;
            background-color: #111;
        }

        h2 {
            color: yellow;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid yellow;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: yellow;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>STUDENT VALIDATION</h2>

            <form id="accessForm">
                <input type="text" placeholder="Seu Nome Completo" required>
                <input type="password" id="studentPass" placeholder="Senha de Acesso" required>
                <button type="submit" class="btn">ENTRAR</button>
            </form>

        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const pass = document.getElementById('studentPass').value;

            if (pass === "pripri2024") {

                // 🔑 salva acesso
                sessionStorage.setItem("acesso", "ok");

                // 🚀 REDIRECIONA PARA SEU GOOGLE FORMS
                window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSdDRDWrYgWb8wX8N9B2xWYtzFxsX2JQg4rp8hMdbcxYO_ixzQ/viewform?usp=dialog";

            } else {
                alert("Senha incorreta.");
            }
        });
    </script>

</body>
</html>
