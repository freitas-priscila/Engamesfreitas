<script>
document.getElementById('accessForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('studentName').value;
    const pass = document.getElementById('studentPass').value;

    if(pass === "pripri2024") {

        // salva acesso + nome
        sessionStorage.setItem("acesso", "ok");
        sessionStorage.setItem("nome", name);

        // envia para Google Forms com nome pré-preenchido
        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdDRDWrYgWb8wX8N9B2xWYtzFxsX2JQg4rp8hMdbcxYO_ixzQ/viewform?usp=pp_url&entry.XXXXXXXX=" + encodeURIComponent(name);

        window.location.href = formURL;

    } else {
        alert("Senha incorreta.");
    }
});
</script>
