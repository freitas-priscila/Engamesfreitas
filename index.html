<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Validação</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* TELA DE VALIDAÇÃO (LOGIN) */
        #validation-screen {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .login-box {
            border: 2px solid yellow;
            padding: 30px;
            border-radius: 20px;
            background-color: #111;
        }
        h2 { color: yellow; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid yellow;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }
        .access-btn {
            width: 100%;
            padding: 15px;
            background-color: yellow;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* TELA DOS JOGOS (ESCONDIDA INICIALMENTE) */
        #portal-screen {
            display: none;
            width: 90%;
            max-width: 600px;
            padding: 30px 0;
        }
        .game-button {
            display: block;
            text-decoration: none;
            border: 2px solid yellow;
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 20px;
            transition: 0.2s;
        }
        .game-button:hover { background-color: #1a1a1a; transform: scale(1.02); }
        .game-title { color: yellow; font-weight: bold; display: block; }
        .game-desc { color: #fff; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="validation-screen">
        <div class="login-box">
            <h2>ACESSO RESTRITO</h2>
            <form id="studentForm">
                <input type="text" id="name" placeholder="Seu Nome Completo" required>
                <input type="password" id="password" placeholder="Senha de Acesso" required>
                <button type="submit" class="access-btn">VALIDAR E ENTRAR</button>
            </form>
        </div>
    </div>

    <div id="portal-screen">
        <h1 style="color: yellow; text-align: center;">Learning Portal</h1>
        
        <a href="phrasal-verbs1-game.html" class="game-button">
            <span class="game-title">Phrasal Verbs: Bring Up vs Throw Up</span>
            <span class="game-desc">Strategic Business English</span>
        </a>

        <a href="as-varias-formas-de-bring.html" class="game-button">
            <span class="game-title">As Várias Formas de Bring</span>
            <span class="game-desc">20 Challenges (B2 Level)</span>
        </a>

        </div>

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const pass = document.getElementById('password').value;

            // 1. ENVIA PARA O SEU GOOGLE FORM (Substitua o link abaixo pelo seu link do Form)
            const formURL = "SEU_LINK_DO_GOOGLE_FORM_AQUI"; 
            
            // Aqui ele simula o envio e libera o portal
            if(pass === "aluno2026") { // Coloque aqui a senha que você quer
                // Esconde login e mostra portal
                document.getElementById('validation-screen').style.display = 'none';
                document.getElementById('portal-screen').style.display = 'block';
                document.body.style.justifyContent = 'flex-start';
            } else {
                alert("Senha incorreta. Verifique com a Professora Priscila.");
            }
        });
    </script>
</body>
</html>
