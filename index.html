<div id="login-screen">
    <div class="login-box">
        <h2>STUDENT VALIDATION</h2>

        <form id="accessForm" action="https://docs.google.com/forms/d/e/SEU_ID_DO_FORM/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
            <input type="text" name="entry.123456789" id="studentName" placeholder="Seu Nome Completo" required>
            <input type="password" id="studentPass" placeholder="Senha de Acesso" required>
            <button type="submit" class="btn">ENTRAR NO PORTAL</button>
        </form>

        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showPortal(); }"></iframe>
    </div>
</div>

<script>
    var submitted = false;

    function showPortal() {
        // Esta função roda assim que o Google responde (dentro do iframe invisível)
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('portal-screen').style.display = 'block';
        document.body.style.justifyContent = 'flex-start';
    }

    document.getElementById('accessForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('studentPass').value;
        const nome = document.getElementById('studentName').value;

        if (pass !== "pripri2024") {
            e.preventDefault(); // Cancela o envio se a senha estiver errada
            alert("Senha incorreta.");
            submitted = false;
        } else {
            // A senha está certa, o formulário será enviado para o iframe e o portal abrirá no onload
            submitted = true;
        }
    });
</script>
