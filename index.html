<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freitas English Classes - Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { border: 2px solid yellow; padding: 30px; border-radius: 20px; background-color: #111; text-align: center; width: 90%; max-width: 400px; }
        h2 { color: yellow; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid yellow; background: #222; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background-color: yellow; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #portal-screen { display: none; width: 90%; max-width: 600px; padding: 30px 0; text-align: center; }
        .game-button { display: block; text-decoration: none; border: 2px solid yellow; border-radius: 15px; margin-bottom: 15px; padding: 20px; color: yellow; font-weight: bold; }
        h1 { color: yellow; border-bottom: 2px solid yellow; padding-bottom: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>STUDENT VALIDATION</h2>
        <form id="accessForm" action="https://docs.google.com/forms/d/e/1FAIpQLScYp-Yv86T_O4iQkR_p13p_I8V-v2yWf9Z0f7j9Y3Z_Z-Z-Z/formResponse" method="POST" target="hidden_iframe">
            <input type="text" name="entry.938744808" id="studentName" placeholder="Seu Nome Completo" required>
            <input type="password" id="studentPass" placeholder="Senha de Acesso" required>
            <button type="submit" class="btn">ENTRAR NO PORTAL</button>
        </form>
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="checkLogin()"></iframe>
    </div>
</div>

<div id="portal-screen">
    <h1>Learning Portal</h1>
    <a href="family-members-1.html" class="game-button">Family Members 1</a>
    <a href="family-members-advanced.html" class="game-button">Family Members Advanced</a>
    <a href="fill-in-the-blanks-2-verb-to-be.html" class="game-button">Verb to Be</a>
    <a href="memory-game-adjectives-people.html" class="game-button">Adjectives: People</a>
    <a href="memory-game-occupations-freitasenglishclass.html" class="game-button">Occupations</a>
    <a href="corporate-match.html" class="game-button">Corporate Match</a>
    <a href="phrasal-verbs1-game.html" class="game-button">Phrasal Verbs</a>
    <a href="as-varias-formas-de-bring.html" class="game-button">Bring (20 Challenges)</a>
</div>

<script>
    var loginTentado = false;
    document.getElementById('accessForm').onsubmit = function() {
        var pass = document.getElementById('studentPass').value;
        if (pass === "s_tudent2026") {
            loginTentado = true;
            return true;
        } else {
            alert("Senha incorreta!");
            return false;
        }
    };
    function checkLogin() {
        if (loginTentado) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('portal-screen').style.display = 'block';
        }
    }
</script>
</body>
</html>
