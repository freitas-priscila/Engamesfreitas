<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As Várias Formas de Bring</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background:#121212;
    color:white;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container { max-width:800px; width:100%; }

h1 {
    color:yellow;
    text-align:center;
    border-bottom:2px solid yellow;
    padding-bottom:10px;
}

.explanations {
    background:#1e1e1e;
    padding:15px;
    border-left:5px solid yellow;
    font-size:0.85rem;
    line-height:1.6;
    margin-bottom:20px;
}

#quiz-container {
    background:#1e1e1e;
    padding:25px;
    border-radius:8px;
}

#header {
    display:flex;
    justify-content:space-between;
    color:yellow;
    font-size:0.8rem;
}

#question {
    text-align:center;
    margin:30px 0;
    font-size:1.2rem;
}

.options-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.option-btn {
    padding:15px;
    background:yellow;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#feedback {
    text-align:center;
    margin:15px;
    font-weight:bold;
}

#nav-controls {
    display:flex;
    justify-content:space-between;
}

.nav-btn {
    padding:10px;
    background:transparent;
    border:1px solid #444;
    color:#aaa;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>As Várias Formas de "Bring"</h1>

<div class="explanations">
<strong>Meaning Guide:</strong><br>
• bring = trazer<br>
• bring along = trazer junto<br>
• bring over = trazer até outro lugar<br>
• bring up = criar / mencionar<br><br>

<strong>Grammar:</strong><br>
bring (base) | brings (he/she) | brought (past)
</div>

<div id="quiz-container">

<div id="header">
<span id="progress"></span>
<span id="score"></span>
</div>

<p id="question"></p>

<div class="options-grid">
<button class="option-btn" onclick="check('bring')">bring</button>
<button class="option-btn" onclick="check('bring along')">bring along</button>
<button class="option-btn" onclick="check('bring over')">bring over</button>
<button class="option-btn" onclick="check('bring up')">bring up</button>

<button class="option-btn" onclick="check('brings along')">brings along</button>
<button class="option-btn" onclick="check('brings up')">brings up</button>
<button class="option-btn" onclick="check('brought along')">brought along</button>
<button class="option-btn" onclick="check('brought up')">brought up</button>
</div>

<div id="feedback"></div>

<div id="nav-controls">
<button class="nav-btn" onclick="prev()">⏪ Voltar</button>
<button class="nav-btn" onclick="next()">Próxima ⏩</button>
</div>

</div>
</div>

<script>

const questions = [

{q:"She ______ her kids to be very independent.", correct:["brings up","brought up"]},

{q:"Remember to ______ your ID card to the exam.", correct:["bring","bring along"]},

{q:"He ______ his laptop to every class.", correct:["brings along"]},

{q:"They were ______ in a traditional family.", correct:["brought up"]},

{q:"You should have been ______ to respect your elders.", correct:["brought up"]},

{q:"Can you ______ me that report?", correct:["bring"]},

{q:"I will ______ the documents later.", correct:["bring over"]},

{q:"Feel free to ______ a friend.", correct:["bring along"]},

{q:"Don't ______ that topic.", correct:["bring up"]},

{q:"He promised not to ______ the issue today.", correct:["bring up"]},

{q:"I need to ______ my notes.", correct:["bring along"]},

{q:"I'll ______ dessert tonight.", correct:["bring over"]},

{q:"Is it hard to ______ a child properly?", correct:["bring up"]},

{q:"You must ______ your umbrella.", correct:["bring along"]},

{q:"Would you ______ me some water?", correct:["bring"]},

{q:"Baby elephants are ______ by the herd.", correct:["brought up"]},

{q:"Did you ______ the keys?", correct:["bring"]},

{q:"It's natural for babies to ______ milk after feeding.", correct:["bring up"]},

{q:"I'll ______ drinks to your house.", correct:["bring over"]},

{q:"She always ______ snacks to meetings.", correct:["brings along"]}

];

let current = 0;
let score = 0;

function load(){
document.getElementById("question").innerText = questions[current].q;
document.getElementById("progress").innerText = `Question ${current+1}/${questions.length}`;
document.getElementById("score").innerText = `Score: ${score}`;
document.getElementById("feedback").innerText = "";
}

function speak(text){
let speech = new SpeechSynthesisUtterance(text);
speech.lang = "en-US";
speech.rate = 0.9;
speechSynthesis.speak(speech);
}

function check(answer){
let q = questions[current];

if(q.correct.includes(answer)){
score++;
document.getElementById("feedback").innerText = "Correct ✓";

let sentence = q.q.replace("______", answer);
speak(sentence);

} else {
document.getElementById("feedback").innerText = "Try again ✗";
}
}

function next(){
if(current < questions.length-1){
current++;
load();
}
}

function prev(){
if(current > 0){
current--;
load();
}
}

load();

</script>

</body>
</html>
