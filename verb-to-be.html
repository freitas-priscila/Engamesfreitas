<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill in the Blanks – Verb To Be</title>
    <style>
        body { background: black; color: white; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: yellow; text-align: center; text-transform: uppercase; border-bottom: 2px solid yellow; padding-bottom: 10px; }
        .prompt { border: 2px solid yellow; padding: 20px; margin-bottom: 30px; max-width: 800px; background-color: #111; border-radius: 15px; text-align: center; }
        .card { border: 1px solid yellow; padding: 20px; margin: 10px auto; width: 100%; max-width: 600px; display: flex; align-items: center; gap: 15px; background: #0a0a0a; border-radius: 10px; }
        .emoji { font-size: 30px; }
        input { background: transparent; color: yellow; border: none; border-bottom: 2px solid yellow; width: 100px; text-align: center; font-size: 20px; outline: none; }
        .feedback { font-weight: bold; font-size: 22px; margin-left: auto; width: 30px; }
        .ok { color: #00ff99; }
        .no { color: #ff5555; }
        .audio { cursor: pointer; font-size: 24px; transition: 0.2s; }
        .audio:hover { transform: scale(1.2); }
        .back-btn { margin-top: 30px; color: yellow; text-decoration: none; border: 1px solid yellow; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🧩 Verb To Be Challenges</h1>
    <p style="color: yellow; margin-top: -15px;">@freitasenglishclasses</p>

    <div class="prompt">
        <strong>Instructions:</strong> Use the correct form of <strong>Verb To Be</strong>:<br><br>
        <code style="color: yellow;">'m not • aren't • isn't • is • Is • 're • are • Are • am • Am</code><br><br>
        ⚠️ <strong>Tip:</strong> Don't forget the apostrophe ( ' ) for contractions!
    </div>

    <div id="exercise-container"></div>

    <a href="index.html" class="back-btn">Back to Portal</a>

    <script>
        const exercises = [
            { id: "q1", text: "I [input] ready.", ans: "am", emoji: "😀", audio: "I am ready" },
            { id: "q2", text: "She [input] not at home.", ans: "is", emoji: "🏠", audio: "She is not at home" },
            { id: "q3", text: "[input] you a teacher?", ans: "Are", emoji: "🎓", audio: "Are you a teacher" },
            { id: "q4", text: "They [input] tired.", ans: "are", emoji: "😴", audio: "They are tired" },
            { id: "q5", text: "He [input] late.", ans: "is", emoji: "⏰", audio: "He is late" },
            { id: "q6", text: "We [input] not students.", ans: "are", emoji: "📚", audio: "We are not students" },
            { id: "q7", text: "Paulo and Maria [input] young.", ans: "aren't", emoji: "👴👵", audio: "Paulo and Maria aren't young" },
            { id: "q8", text: "Anna [input] happy.", ans: "isn't", emoji: "🙁", audio: "Anna isn't happy" },
            // AJUSTE CIRÚRGICO AQUI: Trocado de "'re" para "are"
            { id: "q9", text: "The boys [input] friends.", ans: "are", emoji: "🤝", audio: "The boys are friends" }, 
            { id: "q10", text: "My parents [input] here.", ans: "aren't", emoji: "🏠", audio: "My parents aren't here" },
            { id: "q11", text: "Lucas [input] tired.", ans: "is", emoji: "😓", audio: "Lucas is tired" },
            { id: "q12", text: "The cats [input] outside.", ans: "aren't", emoji: "🐱", audio: "The cats aren't outside" }
        ];

        const container = document.getElementById('exercise-container');

        exercises.forEach((ex) => {
            const card = document.createElement('div');
            card.className = 'card';
            const content = ex.text.replace('[input]', `<input id="${ex.id}" autocomplete="off">`);
            
            card.innerHTML = `
                <span class="audio" onclick="speak('${ex.audio.replace(/'/g, "\\'")}')">🔊</span>
                <span class="emoji">${ex.emoji}</span>
                <span>${content}</span>
                <span id="f${ex.id}" class="feedback"></span>
            `;
            container.appendChild(card);

            document.getElementById(ex.id).addEventListener("input", function() {
                let feedback = document.getElementById("f" + ex.id);
                // Validação ignorando maiúsculas/minúsculas
                if (this.value.trim().toLowerCase() === ex.ans.toLowerCase()) {
                    feedback.textContent = "✔";
                    feedback.className = "feedback ok";
                } else if (this.value === "") {
                    feedback.textContent = "";
                } else {
                    feedback.textContent = "✘";
                    feedback.className = "feedback no";
                }
            });
        });

        function speak(text) {
            window.speechSynthesis.cancel(); 
            let u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US";
            u.rate = 0.8; 
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
