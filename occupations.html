<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game – Occupations</title>
    <style>
        body { background-color: #000; color: #FFD700; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        h1 { margin: 10px 0; text-transform: uppercase; border-bottom: 2px solid #FFD700; display: inline-block; padding-bottom: 5px; }
        h2 { font-size: 16px; color: #fff; margin-bottom: 20px; }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background-color: #111;
            border: 2px solid #FFD700;
            height: 100px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
            color: transparent; /* Esconde o texto inicialmente */
        }

        .card.revealed {
            background-color: #FFD700;
            color: #000;
            transform: rotateY(180deg);
        }

        .emoji { font-size: 40px; }
        
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #FFD700;
            text-decoration: none;
            border: 1px solid #FFD700;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>🧠 Memory Game</h1>
    <h2>Occupations in English - @freitasenglishclasses</h2>
    <p style="color: #fff;">Click to find the pairs and listen! 👂</p>

    <div class="game-board" id="gameBoard"></div>

    <a href="index.html" class="back-btn">Back to Portal</a>

    <script>
        const pairs = [
            { word: "a teacher", emoji: "👩‍🏫" },
            { word: "a doctor", emoji: "👨‍⚕️" },
            { word: "a student", emoji: "🎓" },
            { word: "an engineer", emoji: "🛠️" },
            { word: "a chef", emoji: "👨‍🍳" },
            { word: "an admin assistant", emoji: "🗂️" },
            { word: "a welder", emoji: "🔥" },
            { word: "a virtual assistant", emoji: "💻" },
            { word: "an influencer", emoji: "📱" },
            { word: "a content creator", emoji: "🎥" },
            { word: "a writer", emoji: "✍️" },
            { word: "a secretary", emoji: "📞" },
            { word: "an agronomist", emoji: "🌱" },
            { word: "a farmer", emoji: "🚜" }
        ];

        let cardsData = [];
        pairs.forEach(pair => {
            cardsData.push({ type: "word", content: pair.word, speak: pair.word });
            cardsData.push({ type: "emoji", content: pair.emoji, speak: pair.word });
        });

        cardsData.sort(() => Math.random() - 0.5);

        const board = document.getElementById("gameBoard");
        let firstCard = null;
        let lockBoard = false;

        cardsData.forEach(data => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.dataset.speak = data.speak;

            card.addEventListener("click", () => {
                if (lockBoard || card.classList.contains("revealed")) return;

                card.classList.add("revealed");
                card.innerHTML = data.type === "emoji" ? `<span class="emoji">${data.content}</span>` : data.content;
                
                speak(data.speak);

                if (!firstCard) {
                    firstCard = card;
                } else {
                    lockBoard = true;
                    if (firstCard.dataset.speak === card.dataset.speak) {
                        firstCard = null;
                        lockBoard = false;
                    } else {
                        setTimeout(() => {
                            card.classList.remove("revealed");
                            card.innerHTML = "";
                            firstCard.classList.remove("revealed");
                            firstCard.innerHTML = "";
                            firstCard = null;
                            lockBoard = false;
                        }, 1000);
                    }
                }
            });
            board.appendChild(card);
        });

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
