<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game – Occupations</title>
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 10px 0;
            text-transform: uppercase;
            border-bottom: 2px solid #FFD700;
            display: inline-block;
            padding-bottom: 5px;
            font-size: 2rem;
        }

        h2 { font-size: 16px; color: #fff; margin: 5px 0 20px 0; font-weight: normal; }
        p { color: #fff; margin: 0 0 30px 0; }
        
        /* Contêiner Principal do Jogo */
        .game-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7 cartas por linha no computador */
            gap: 15px; /* Mais espaço entre as cartas */
            max-width: 1000px;
            width: 95%;
            margin: auto;
            perspective: 1000px; /* Cria o efeito 3D de profundidade */
        }

        /* Estrutura da Carta (o "pai" que gira) */
        .card {
            background-color: transparent;
            height: 140px; /* Cartas mais altas (antes eram 100px) */
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 10px;
        }

        /* Estado da carta quando virada */
        .card.revealed {
            transform: rotateY(180deg);
        }

        /* Estilo comum para Frente e Verso */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Esconde a face oposta */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid #FFD700;
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.1);
        }

        /* Frente da Carta (O Verso do Jogo) */
        .card-front {
            background-color: #1a1a1a;
            color: #FFD700;
            font-size: 20px;
        }

        /* Verso da Carta (A Face com o Conteúdo) */
        .card-back {
            background-color: #FFD700;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 5px;
            box-sizing: border-box;
            /* CRUCIAL: Corrige o texto invertido */
            transform: rotateY(180deg); 
        }

        .emoji { font-size: 60px; } /* Emojis maiores */
        
        /* Botão de Voltar */
        .back-btn {
            display: inline-block;
            margin: 40px auto;
            color: #FFD700;
            text-decoration: none;
            border: 1px solid #FFD700;
            padding: 12px 24px;
            border-radius: 5px;
            transition: 0.2s;
        }
        
        .back-btn:hover { background-color: #FFD700; color: #000; }

        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr); /* 4 cartas por linha no celular */
                gap: 10px;
            }
            .card { height: 110px; }
            .emoji { font-size: 45px; }
            .card-back { font-size: 12px; }
        }
    </style>
</head>
<body>

    <h1>🧠 Memory Game</h1>
    <h2>Occupations in English</h2>
    <h2>@freitasenglishclasses</h2>
    <p>Click to find the pairs and listen! 👂</p>

    <div class="game-board" id="gameBoard"></div>

    <a href="index.html" class="back-btn">Back to Portal</a>

    <script>
        const pairs = [
            { word: "a teacher", emoji: "👩‍🏫" },
            { word: "a doctor", emoji: "👨‍⚕️" },
            { word: "a student", emoji: "🎓" },
            { word: "an engineer", emoji: "🛠️" },
            { word: "a chef", emoji: "👨‍🍳" },
            { word: "an admin assistant", emoji: "🗂️" },
            { word: "a welder", emoji: "🔥" },
            { word: "a virtual assistant", emoji: "💻" },
            { word: "an influencer", emoji: "📱" },
            { word: "a content creator", emoji: "🎥" },
            { word: "a writer", emoji: "✍️" },
            { word: "a secretary", emoji: "📞" },
            { word: "an agronomist", emoji: "🌱" },
            { word: "a farmer", emoji: "🚜" }
        ];

        let cardsData = [];
        pairs.forEach(pair => {
            cardsData.push({ type: "word", content: pair.word, speak: pair.word });
            cardsData.push({ type: "emoji", content: pair.emoji, speak: pair.word });
        });

        cardsData.sort(() => Math.random() - 0.5);

        const board = document.getElementById("gameBoard");
        let firstCard = null;
        let lockBoard = false;

        cardsData.forEach(data => {
            // Cria a estrutura da carta
            const card = document.createElement("div");
            card.classList.add("card");
            card.dataset.speak = data.speak;

            // Cria o verso da carta (a face escondida preta)
            const frontFace = document.createElement("div");
            frontFace.classList.add("card-front");
            frontFace.innerHTML = "?"; // Você pode colocar o seu logo aqui se quiser

            // Cria a frente da carta (a face amarela revelada)
            const backFace = document.createElement("div");
            backFace.classList.add("card-back");
            
            if (data.type === "emoji") {
                backFace.innerHTML = `<span class="emoji">${data.content}</span>`;
            } else {
                backFace.innerHTML = `<span>${data.content}</span>`;
            }

            // Monta a carta
            card.appendChild(frontFace);
            card.appendChild(backFace);

            // Lógica do clique
            card.addEventListener("click", () => {
                if (lockBoard || card.classList.contains("revealed")) return;

                card.classList.add("revealed");
                speak(data.speak);

                if (!firstCard) {
                    firstCard = card;
                } else {
                    lockBoard = true;
                    if (firstCard.dataset.speak === card.dataset.speak) {
                        firstCard = null;
                        lockBoard = false;
                    } else {
                        setTimeout(() => {
                            card.classList.remove("revealed");
                            firstCard.classList.remove("revealed");
                            firstCard = null;
                            lockBoard = false;
                        }, 1200); // 1.2 segundos para ver a carta antes de desvirar
                    }
                }
            });
            board.appendChild(card);
        });

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
