<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customized English - Student Selection Hub</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .hub-container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #4b148c; /* Roxo padrão do seu Forms */
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #5f6368;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: block;
            padding: 18px;
            margin: 12px 0;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, background 0.3s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        /* Questionnaire 1 - Cor Principal */
        .btn-primary {
            background-color: #673ab7;
            color: white;
        }
        .btn-primary:hover {
            background-color: #512da8;
        }
        /* Questionnaire 2 - Cor Beginner */
        .btn-secondary {
            background-color: #00796b;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #004d40;
        }
        .method-tag {
            margin-top: 2rem;
            display: inline-block;
            font-size: 0.75rem;
            color: #70757a;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="hub-container">
    <h1>Customized English</h1>
    <p>Escolha o questionário de triagem abaixo para iniciar sua jornada ao nível A2.</p>

    <a href="https://forms.gle/afMKUCxQvHSQdaJr7" target="_blank" class="btn btn-primary">
        Questionnaire 1 - Standard Selection
    </a>

    <a href="https://forms.gle/wwhZYRgHRf6HFqZA7" target="_blank" class="btn btn-secondary">
        Questionnaire 2 - Beginner Level
    </a>

    <div class="method-tag">
        <strong>A2 Level in 8 Months</strong><br>
        Focus: Professional & Technical English
    </div>
</div>

</body>
</html>
