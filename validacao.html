<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Portal - Freitas English</title>
    <style>
        body { background-color: #000; color: #d4af37; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .container { border: 2px solid #d4af37; padding: 40px; border-radius: 15px; background: rgba(20, 20, 20, 0.9); box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        h1 { margin-bottom: 20px; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #d4af37; background: #222; color: #fff; margin-bottom: 20px; text-align: center; }
        button { padding: 10px 25px; background-color: #d4af37; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        button:hover { background-color: #fff; color: #000; }
        #linkArea { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="welcomeMsg">Acesso Restrito</h2>
        <input type="password" id="passInput" placeholder="Digite sua chave de acesso">
        <br>
        <button onclick="verificarAcesso()">Próximo</button>

        <div id="linkArea">
            <p>Acesso liberado para triagem estratégica!</p>
            <button onclick="abrirFormulario()">INICIAR DIAGNÓSTICO ESTRATÉGICO</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cliente = urlParams.get('cliente') || 'Visitante';
        document.getElementById('welcomeMsg').innerText = "Acesso Restrito: " + cliente.toUpperCase();

        function verificarAcesso() {
            const senha = document.getElementById('passInput').value;
            // SENHA UNIFICADA AQUI:
            if (senha === 'aluno2026') {
                document.getElementById('linkArea').style.display = 'block';
                document.getElementById('passInput').style.display = 'none';
                document.querySelector('button').style.display = 'none';
            } else {
                alert("Senha incorreta!");
            }
        }

        function abrirFormulario() {
            // LINK DO SEU FORMULÁRIO QUE PEDE E-MAIL:
            window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSddDRWrYgWb8wX8N9B2xWYtzFxsX2JQq4rp8hMdbcxYO_ixzQ/viewform?usp=pp_url&entry.123456789=" + cliente;
        }
    </script>
</body>
</html>
