<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Protocolo de Segurança - Profª Priscila</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; border: 2px solid #f39c12; padding: 40px; border-radius: 15px; max-width: 450px; }
        .btn { display: inline-block; margin-top: 25px; padding: 15px 30px; background-color: #f39c12; color: #000; text-decoration: none; font-weight: bold; border-radius: 5px; }
        h1 { color: #f39c12; font-size: 22px; }
    </style>
</head>
<body onload="check()">
    <div id="denied" class="box">
        <h1>ACESSO RESTRITO</h1>
        <p>Este ambiente é exclusivo para diagnóstico técnico de alunos validados.</p>
        <p style="color: #e74c3c; font-weight: bold;">Tentativa de acesso não autorizado registrada.</p>
    </div>

    <div id="allowed" class="box" style="display:none;">
        <h1>PORTAL DE DIAGNÓSTICO</h1>
        <p>Seja bem-vindo(a). Para iniciarmos sua avaliação de proficiência, clique no botão abaixo:</p>
        <a href="COLE_AQUI_O_LINK_DO_SEU_GOOGLE_FORMS" class="btn">INICIAR AGORA</a>
    </div>

    <script>
        function check() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('acesso') === 'aluno2026') {
                document.getElementById('denied').style.display = 'none';
                document.getElementById('allowed').style.display = 'block';
            }
        }
    </script>
</body>
</html>
