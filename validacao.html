<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Selection Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-sizing: border-box;
        }
        .btn-standard {
            background-color: #3498db;
        }
        .btn-standard:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .btn-beginner {
            background-color: #2ecc71;
        }
        .btn-beginner:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #bdc3c7;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Customized English</h1>
    <p>Please select the appropriate questionnaire to begin your professional evaluation.</p>
    
    <a href="https://forms.gle/afMKUCxQvHSQdaJr7" class="btn btn-standard">Questionnaire 1</a>
    
    <a href="https://forms.gle/wwhZYRgHRf6HFqZA7" class="btn btn-beginner">Questionnaire 2 (Beginner)</a>

    <div class="footer">
        Professional & Technical English Selection<br>
        © 2026 Customized Method
    </div>
</div>

</body>
</html>
