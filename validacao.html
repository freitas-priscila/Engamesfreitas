<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Portal - Freitas English</title>

    <style>
        body {
            background-color: #000;
            color: #d4af37;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            border: 2px solid #d4af37;
            padding: 40px;
            border-radius: 15px;
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            width: 90%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 1.2em;
        }

        input {
            padding: 12px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #d4af37;
            background: #222;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1em;
        }

        button {
            padding: 12px 25px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: 0.3s;
        }

        button:hover {
            background-color: #fff;
            color: #000;
        }

        #linkArea {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px; /* ✅ CORRIGIDO */
        }

        .success-text {
            color: #fff;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
    </style>

    <!-- garante que o DOM carregue antes do JS -->
    <script defer>
        document.addEventListener("DOMContentLoaded", () => {

            const urlParams = new URLSearchParams(window.location.search);
            const cliente = urlParams.get('cliente') || 'Visitante';

            document.getElementById('welcomeMsg').innerText =
                "Acesso Restrito: " + cliente.toUpperCase();

            window.verificarAcesso = function () {
                const senha = document.getElementById('passInput').value;

                if (senha === 'aluno2026') {
                    document.getElementById('linkArea').style.display = 'block';
                    document.getElementById('loginArea').style.display = 'none';
                } else {
                    alert("Senha incorreta! Tente novamente.");
                }
            };

            window.abrirFormulario = function () {
                window.location.href =
                    "https://docs.google.com/forms/d/e/1FAIpQLSddDRWrYgWb8wX8N9B2xWYtzFxsX2JQq4rp8hMdbcxYO_ixzQ/viewform";
            };
        });
    </script>
</head>

<body>
    <div class="container">
        <h2 id="welcomeMsg">Acesso Restrito</h2>

        <div id="loginArea">
            <input type="password" id="passInput" placeholder="Sua chave de acesso">
            <br>
            <button onclick="verificarAcesso()">ACESSAR PORTAL</button>
        </div>

        <div id="linkArea">
            <p class="success-text">Chave validada com sucesso!</p>
            <button onclick="abrirFormulario()">INICIAR DIAGNÓSTICO ESTRATÉGICO</button>
        </div>
    </div>
</body>
</html>
