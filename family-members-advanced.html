<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Members 2 Advanced - Memory Game</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-back: #000000;
            --card-front: #ffcc00; 
            --text-white: #ffffff;
            --text-yellow: #ffcc00;
            --border-yellow: #ffcc00;
            --match-green: #4CAF50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--text-yellow); margin: 5px 0; text-transform: uppercase; border-bottom: 2px solid var(--text-yellow); padding-bottom: 5px; font-size: 2.2rem;}
        p { color: var(--text-white); margin: 5px 0; font-size: 1.1rem; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7 cartas por linha no PC */
            gap: 15px;
            max-width: 1100px;
            width: 95%;
            perspective: 1000px;
        }

        .card {
            height: 150px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 10px;
        }

        /* Estado virado */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Estilo comum para Frente e Verso */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid var(--border-yellow);
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
        }

        /* Frente (O Verso do Jogo - Preto) */
        .card-front {
            background-color: var(--card-back);
            color: var(--text-yellow);
            font-size: 2.5rem;
        }

        /* Verso (A Face Revelada - Amarela) */
        .card-back {
            background-color: var(--card-front);
            color: #000000;
            transform: rotateY(180deg); /* Crucial: Pré-inverte a face */
            font-size: 0.85rem;
        }

        .emoji { font-size: 2.5rem; margin-bottom: 8px; }

        /* Estado de MATCH: Fica verde e permanece virado */
        .card.matched .card-back {
            border-color: var(--match-green);
            opacity: 0.6;
        }

        .controls { margin-top: 40px; display: flex; gap: 20px; }
        
        .btn {
            background: var(--text-yellow);
            color: black;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
        }
        
        .btn:hover { background-color: #ffdb4d; transform: scale(1.05); }

        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .card { height: 110px; }
            .emoji { font-size: 45px; }
            .card-back { font-size: 11px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Family Members 2 Advanced</h1>
        <p>@freitasenglishclasses - Teacher: Priscila Freitas</p>
        <p style="font-size: 0.9rem; color: #aaa;">Click to find pairs. English cards have audio! 👂</p>
    </header>

    <div class="game-grid" id="grid"></div>

    <div class="controls">
        <button class="btn" onclick="startGame()">Reset Game</button>
        <a href="index.html" class="btn">Back to Portal</a>
    </div>

    <script>
        const vocabulary = [
            { en: "Great grandparents", pt: "Bisavós", icon: "👵👴" },
            { en: "Great grandson and Great granddaughter", pt: "Bisneto e Bisneta", icon: "👶" },
            { en: "Great uncle and Great aunt", pt: "Tio avô e Tia avó", icon: "👴" },
            { en: "First cousin and Second cousin", pt: "Primo de primeiro grau e segundo grau", icon: "🧒" },
            { en: "Nephew and Niece", pt: "Sobrinho e Sobrinha", icon: "👦" },
            { en: "Mother in law and Father in law", pt: "Sogra e Sogro", icon: "💍" },
            { en: "Parents in law", pt: "Sogros", icon: "👪" },
            { en: "Brother in law and Sister in law", pt: "Cunhado e Cunhada", icon: "🤝" },
            { en: "Son in law", pt: "Genro", icon: "🤵" },
            { en: "Fiancé and Fiancée", pt: "Noivo e Noiva", icon: "🥂" },
            { en: "Partner", pt: "Parceiro", icon: "❤️" },
            { en: "Godmother and Godfather", pt: "Madrinha e Padrinho", icon: "✨" },
            { en: "Godchild", pt: "Afilhado", icon: "👼" },
            { en: "Stepparents", pt: "Padrasto e Madrasta", icon: "🏠" },
            { en: "Stepbrother and Stepsister", pt: "Irmão e Irmã de consideração", icon: "👫" },
            { en: "Half brother and Half sister", pt: "Meio irmão e Meia irmã de sangue", icon: "🧬" },
            { en: "Foster child", pt: "Filho adotivo", icon: "💟" },
            { en: "An only child", pt: "Filho único", icon: "🧍" }
        ];

        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;

        function speak(text, type) {
            if (type === 'pt') return; // Sem áudio para português
            window.speechSynthesis.cancel();
            
            // Limpa o texto: remove "/" e "()"
            let cleanText = text.replace(/\//g, " and ").replace(/\(/g, "").replace(/\)/g, "");
            
            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function startGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            lockBoard = false;

            let cardData = [];
            vocabulary.forEach((item, index) => {
                cardData.push({ text: item.en, type: 'en', id: index, icon: item.icon });
                cardData.push({ text: item.pt, type: 'pt', id: index, icon: item.icon });
            });

            // Embaralha as cartas
            cardData.sort(() => Math.random() - 0.5);

            cardData.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = data.id;
                card.dataset.type = data.type;
                card.dataset.speak = data.text;

                card.innerHTML = `
                    <div class="card-front">?</div>
                    <div class="card-back">
                        <span class="emoji">${data.icon}</span>
                        <span>${data.text}</span>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this === flippedCards[0] || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            speak(this.dataset.speak, this.dataset.type);

            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            let [c1, c2] = flippedCards;

            // Verifica se os IDs são iguais (o par certo) e os tipos são diferentes (EN vs PT)
            if (c1.dataset.id === c2.dataset.id && c1.dataset.type !== c2.
