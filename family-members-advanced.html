<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Members Advanced - Memory Game</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-back: #1a1a1a;
            --card-front: #ffcc00; 
            --text-yellow: #ffcc00;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { color: var(--text-yellow); text-transform: uppercase; border-bottom: 2px solid var(--text-yellow); margin-bottom: 10px; }
        .subtitle { margin-bottom: 30px; text-align: center; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            max-width: 1000px;
            width: 95%;
            perspective: 1000px;
        }

        .card {
            height: 140px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flipped { transform: rotateY(180deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 2px solid var(--text-yellow);
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
        }

        .back { background-color: var(--card-back); color: var(--text-yellow); font-size: 2rem; }
        
        .front { 
            background-color: var(--card-front); 
            color: black; 
            transform: rotateY(180deg); 
            font-size: 0.85rem; 
        }

        .card.matched { cursor: default; }
        .card.matched .front { border-color: #4CAF50; opacity: 0.7; }

        .emoji { font-size: 2.2rem; margin-bottom: 5px; }

        .controls { margin-top: 30px; display: flex; gap: 15px; }
        .btn {
            background: var(--text-yellow);
            color: black;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(4, 1fr); }
            .card { height: 100px; }
        }
    </style>
</head>
<body>

    <h1>Family Members Advanced</h1>
    <div class="subtitle">@freitasenglishclasses<br>Click to find pairs! English cards have audio! 👂</div>

    <div class="game-grid" id="grid"></div>

    <div class="controls">
        <button class="btn" onclick="startGame()">Reset Game</button>
        <a href="index.html" class="btn">Back to Portal</a>
    </div>

    <script>
        const vocabulary = [
            { en: "Great grandparents", pt: "Bisavós", icon: "👵👴" },
            { en: "Great grandson and Great granddaughter", pt: "Bisneto e Bisneta", icon: "👶" },
            { en: "Great uncle and Great aunt", pt: "Tio avô e Tia avó", icon: "👴" },
            { en: "First cousin and Second cousin", pt: "Primo de primeiro grau e segundo grau", icon: "🧒" },
            { en: "Nephew and Niece", pt: "Sobrinho e Sobrinha", icon: "👦" },
            { en: "Mother in law and Father in law", pt: "Sogra e Sogro", icon: "💍" },
            { en: "Parents in law", pt: "Sogros", icon: "👪" },
            { en: "Brother in law and Sister in law", pt: "Cunhado e Cunhada", icon: "🤝" },
            { en: "Son in law", pt: "Genro", icon: "🤵" },
            { en: "Fiancé and Fiancée", pt: "Noivo e Noiva", icon: "🥂" },
            { en: "Partner", pt: "Parceiro", icon: "❤️" },
            { en: "Godmother and Godfather", pt: "Madrinha e Padrinho", icon: "✨" },
            { en: "Godchild", pt: "Afilhado", icon: "👼" },
            { en: "Stepparents", pt: "Padrasto e Madrasta", icon: "🏠" },
            { en: "Stepbrother and Stepsister", pt: "Irmão e Irmã de consideração", icon: "👫" },
            { en: "Half brother and Half sister", pt: "Meio irmão e Meia irmã de sangue", icon: "🧬" },
            { en: "Foster child", pt: "Filho adotivo", icon: "💟" },
            { en: "An only child", pt: "Filho único", icon: "🧍" }
        ];

        let flipped = [];
        let lock = false;

        function speak(text, isEn) {
            if (!isEn) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\//g, " and ").replace(/\(/g, "").replace(/\)/g, "");
            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function startGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flipped = [];
            lock = false;

            let cards = [];
            vocabulary.forEach((item, i) => {
                cards.push({ text: item.en, type: 'en', id: i, icon: item.icon });
                cards.push({ text: item.pt, type: 'pt', id: i, icon: item.icon });
            });

            cards.sort(() => Math.random() - 0.5);

            cards.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="face back">?</div>
                    <div class="face front">
                        <span class="emoji">${data.icon}</span>
                        <span>${data.text}</span>
                    </div>
                `;
                card.onclick = () => {
                    if (lock || card.classList.contains('flipped')) return;
                    card.classList.add('flipped');
                    speak(data.text, data.type === 'en');
                    flipped.push({ el: card, data: data });

                    if (flipped.length === 2) {
                        lock = true;
                        const [c1, c2] = flipped;
                        if (c1.data.id === c2.data.id && c1.data.type !== c2.data.type) {
                            c1.el.classList.add('matched');
                            c2.el.classList.add('matched');
                            flipped = [];
                            lock = false;
                        } else {
                            setTimeout(() => {
                                c1.el.classList.remove('flipped');
                                c2.el.classList.remove('flipped');
                                flipped = [];
                                lock = false;
                            }, 1000);
                        }
                    }
                };
                grid.appendChild(card);
            });
        }

        startGame();
    </script>
</body>
</html>
